name: Sync Render deployment branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: render-deployment-branch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Fast-forward Render branch from main
        shell: bash
        run: |
          set -euo pipefail
          deployment_branch="codex/fresh-free-deploy"
          git fetch origin "+refs/heads/$deployment_branch:refs/remotes/origin/$deployment_branch"
          if ! git merge-base --is-ancestor "origin/$deployment_branch" origin/main; then
            echo "::error::The deployment branch contains commits not merged into main; refusing to overwrite it."
            exit 1
          fi
          git push origin "origin/main:refs/heads/$deployment_branch"
